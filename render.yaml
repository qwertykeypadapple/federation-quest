# Render Blueprint — deploy as a STATIC SITE (recommended for this Vite SPA).
# In Render: New + > Blueprint, point it at this repo.
services:
  - type: web
    name: federation-quest
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      # single-page app: serve index.html for any path
      - type: rewrite
        source: /*
        destination: /index.html
